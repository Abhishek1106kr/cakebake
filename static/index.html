<body>
<div id="app"></div>
<script>
const PRODUCTS = [
 {slug:'almond-croissant',name:'Almond Croissant',desc:'Buttery layers · almond cream · toasted almonds',price:320,cats:['pastry'],moods:['warm','nutty','not too sweet']},
 {slug:'flat-white',name:'Flat White',desc:'Double espresso · silky milk · balanced finish',price:220,cats:['coffee','drinks'],moods:['warm','smooth','coffee']},
 {slug:'pistachio-tart',name:'Pistachio Tart',desc:'Pistachio · vanilla · crisp pastry',price:340,cats:['dessert','pastry'],moods:['nutty','not too sweet']},
 {slug:'chocolate-tart',name:'Chocolate Tart',desc:'Dark chocolate · hazelnut · sea salt',price:340,cats:['dessert','pastry'],moods:['chocolatey','rich','not too sweet']},
 {slug:'cold-brew',name:'Cold Brew',desc:'Slow-steeped · bright finish · low bitterness',price:240,cats:['coffee','drinks'],moods:['cold','bright','light']},
 {slug:'cinnamon-roll',name:'Cinnamon Roll',desc:'Brown sugar · cinnamon · soft center',price:260,cats:['pastry','brunch'],moods:['warm','sweet']},
 {slug:'avocado-toast',name:'Avocado Toast',desc:'Sourdough · avocado · herbs · lemon',price:390,cats:['brunch'],moods:['light','brunch','fresh']},
 {slug:'tresor-tonic',name:'Tresor Tonic',desc:'Espresso · tonic · citrus peel',price:260,cats:['drinks'],moods:['cold','bright','refreshing']}
];
const chips=['warm + nutty','chocolatey','cold + bright','light brunch'];
const cats=['all','coffee','pastry','dessert','brunch','drinks'];
const getCart=()=>JSON.parse(localStorage.getItem('tresor-cart')||'[]');
const saveCart=c=>{localStorage.setItem('tresor-cart',JSON.stringify(c));render()};
const add=(slug,qty=1)=>{const c=getCart();const p=PRODUCTS.find(x=>x.slug===slug);if(!p)return;const e=c.find(x=>x.slug===slug);if(e)e.quantity+=qty;else c.push({...p,quantity:qty});saveCart(c)};
const setQty=(slug,q)=>{let c=getCart();c=c.map(x=>x.slug===slug?{...x,quantity:q}:x).filter(x=>x.quantity>0);saveCart(c)};
const removeItem=slug=>saveCart(getCart().filter(x=>x.slug!==slug));
const subtotal=()=>getCart().reduce((s,x)=>s+x.price*x.quantity,0);
const delivery=()=>subtotal()===0?0:(subtotal()>1000?0:40);
const total=()=>subtotal()+delivery();
const semantic=(q)=>{q=q.toLowerCase().trim();if(!q)return PRODUCTS;const terms=q.split(/\s+|\+|,|and/g).filter(Boolean);const alias={chocolatey:['chocolate','rich'],nutty:['almond','pistachio','hazelnut'],cold:['cold','bright','refreshing'],light:['light','fresh','bright'],brunch:['brunch','fresh','light']};const sc=p=>terms.reduce((n,t)=>n+(([p.name,p.desc,...p.cats,...p.moods].join(' ').toLowerCase().includes(t))?3:((alias[t]||[]).some(a=>(p.name+' '+p.desc+' '+p.moods.join(' ')).toLowerCase().includes(a))?2:0)),0);return [...PRODUCTS].sort((a,b)=>sc(b)-sc(a));};
const img=t=>`<div class="img"><span class="img-label">${t}</span></div>`;
function header(active=''){const count=getCart().length.toString().padStart(2,'0');return `<header class="header"><div class="header-in"><a class="wordmark" href="#/">TRESOR</a><div class="spacer"></div><nav class="nav"><a class="${active==='menu'?'active':''}" href="#/menu">MENU</a><a class="${active==='about'?'active':''}" href="#/about">ABOUT</a><a class="${active==='contact'?'active':''}" href="#/contact">CONTACT</a></nav><a class="btn primary" href="#/menu">ORDER</a><a class="bag-btn" href="#/cart" aria-label="Cart"><span>◒</span><span>${count}</span></a></div></header>`}
function footer(){return `<footer class="footer"><span>© ${new Date().getFullYear()} Tresor · Bengaluru</span><span><a href="#/contact">Visit</a> · <a href="https://www.zomato.com/" target="_blank">Zomato</a> · <a href="https://www.swiggy.com/" target="_blank">Swiggy</a></span></footer>`}
function productCard(p,big=false){return `<article class="menu-card ${big?'big':''} rise"><a href="#/product/${p.slug}">${img('Editorial product image')}<div class="product-name">${p.name}</div></a><div class="product-desc">${p.desc}</div><div class="menu-card-actions"><strong style="font-size:13px">₹${p.price}</strong><button class="btn secondary" onclick="event.stopPropagation();add('${p.slug}')">＋ ADD</button></div></article>`}
function pageHome(){const fs=PRODUCTS.slice(0,3);return header()+`<main><section class="page hero"><aside class="hero-side"><div class="side-word">TRESOR</div><div class="side-bottom"><div><div class="eyebrow" style="color:#fff">BENGALURU</div><div style="margin-top:10px;font-size:11px;color:rgba(255,255,255,.76)">Whitefield · 08:00 — 23:00</div></div><div><div class="eyebrow" style="color:#fff">THE HOUSE OF</div><div class="display" style="font-size:32px;margin-top:8px">good coffee</div></div></div></aside><div class="hero-main"><div class="img hero-img fade"><span class="img-label">Cinematic interior / coffee still</span></div><div class="stamp">NEW<br>TODAY</div><div class="hero-copy rise"><div class="eyebrow">01 / THE HOUSE OF TRESOR</div><h1 class="hero-h1 display"><span>GOOD COFFEE.</span><span>SLOW MOMENTS.</span></h1><p class="lede">A contemporary café for mornings that become afternoons.</p><div class="hero-actions"><a class="btn primary" href="#/menu">EXPLORE MENU</a><a class="btn secondary" href="#/about">OUR STORY</a></div></div></div></section><section class="page sig rise"><div class="sig-head"><div><div class="eyebrow">SIGNATURE</div><h2 class="display">Made for the first sip.</h2></div><a class="btn secondary" href="#/menu">VIEW THE MENU →</a></div><div class="sig-grid">${fs.map((p,i)=>productCard(p,false)).join('')}</div><div class="order-ribbon"><span>Order delivery</span><div class="ribbon-links"><a class="btn secondary" href="https://www.zomato.com/" target="_blank">ZOMATO ↗</a><a class="btn secondary" href="https://www.swiggy.com/" target="_blank">SWIGGY ↗</a></div></div></section><section class="page section rise"><div style="display:grid;grid-template-columns:1fr 1.1fr;gap:50px;align-items:center"><div><div class="eyebrow">THE HOUSE</div><h2 class="title display">Coffee, pastry,<br>conversation.</h2><p class="lede">Tresor is built around the simple idea that a café should make time feel a little slower — considered without excess.</p><a class="btn secondary" style="margin-top:24px" href="#/about">READ OUR STORY</a></div>${img('Editorial café interior')}</div></section><section class="page section"><div class="eyebrow">VISIT TRESOR</div><div style="display:grid;grid-template-columns:1fr .8fr;gap:40px;margin-top:18px"><div class="display" style="font-size:52px;line-height:.95">Whitefield,<br>Bengaluru.</div><div><p class="lede" style="margin:0">08:00 — 23:00 · Monday to Sunday</p><a class="btn primary" style="margin-top:22px" href="#/contact">GET DIRECTIONS →</a></div></div></section></main>`+footer()}
function pageMenu(){let q='something warm, nutty and not too sweet',cat='all';const renderResults=()=>{let r=semantic(q);if(cat!=='all')r=r.filter(p=>p.cats.includes(cat));return r};const renderGrid=()=>renderResults().map((p,i)=>productCard(p,i===0)).join('');let grid=renderGrid();setTimeout(()=>{document.getElementById('menu-grid').innerHTML=renderGrid();bindMenu()},0);return header('menu')+`<main class="page section"><div class="eyebrow">MENU / 06 CATEGORIES</div><h1 class="title display">What are you in the mood for?</h1><p class="lede">Type it naturally. Tresor will read the feeling, not just the keyword.</p><form id="search-form" class="search"><input id="search-input" value="${q}" aria-label="Semantic product search"><button>⌕</button></form><div class="chips">${chips.map(c=>`<button class="chip ${c===q?'active':''}" data-query="${c}">${c}</button>`).join('')}</div><div class="filters"><span class="eyebrow">FILTER</span>${cats.map(c=>`<button class="chip ${c===cat?'active':''}" data-cat="${c}">${c.toUpperCase()}</button>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:end;margin-top:42px"><div><div class="eyebrow">CURATED FOR YOUR MOOD</div><div id="result-count" style="font-size:13px;color:var(--muted);margin-top:9px">${renderResults().length} things you might like</div></div><a class="btn secondary" href="#/cart">VIEW BAG →</a></div><div id="menu-grid" class="menu-grid">${grid}</div></main>`+footer();function bindMenu(){const input=document.getElementById('search-input');document.getElementById('search-form').onsubmit=e=>{e.preventDefault();q=input.value;update()};document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>{q=b.dataset.query;input.value=q;update()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;update()})}function update(){document.getElementById('menu-grid').innerHTML=renderGrid();document.getElementById('result-count').textContent=`${renderResults().length} things you might like`;bindMenu()}}
function pageProduct(slug){const p=PRODUCTS.find(x=>x.slug===slug);if(!p)return pageNotFound();return header('menu')+`<main class="page"><a class="eyebrow" href="#/menu" style="display:inline-flex;gap:8px;margin-top:40px">← BACK TO MENU</a><div class="product-layout"><div class="img" style="min-height:620px"><span class="img-label">Macro product photograph</span></div><section class="product-info"><div class="eyebrow" style="color:#fff">01 / SIGNATURE PASTRY</div><h1 class="display">${p.name}</h1><p>${p.desc}</p><div class="price-lg">₹${p.price}</div><div class="meta">TODAY · FRESHLY PREPARED</div><div class="qty"><button id="minus">−</button><span id="qty">1</span><button id="plus">＋</button></div><button id="add-product" class="btn secondary">◒ ADD TO CART</button><div style="margin-top:38px"><div class="meta">DELIVERY / PICKUP</div><p style="margin-top:8px">Bengaluru delivery available. Order for delivery or pick up from the café.</p></div></section></div><section class="section"><div class="eyebrow">YOU MAY ALSO LIKE</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:26px">${PRODUCTS.filter(x=>x.slug!==p.slug).slice(0,3).map(x=>`<a href="#/product/${x.slug}">${img('Product image')}<div class="product-name">${x.name}</div><div class="product-price">₹${x.price}</div></a>`).join('')}</div></section></main>`+footer();setTimeout(()=>{let q=1;document.getElementById('minus').onclick=()=>{q=Math.max(1,q-1);document.getElementById('qty').textContent=q};document.getElementById('plus').onclick=()=>{q++;document.getElementById('qty').textContent=q};document.getElementById('add-product').onclick=()=>{add(p.slug,q);location.hash='#/cart'}},0)}
function pageCart(){const c=getCart();const sub=subtotal(),del=delivery(),tot=total();return `<main class="cart-shell"><div class="cart-wrap"><section><div class="eyebrow" style="color:var(--sage-light)">YOUR BAG</div><h1 class="display">A small order.<br>A very good idea.</h1>${c.length?c.map((x,i)=>`<div class="cart-item"><div class="cart-index">${String(i+1).padStart(2,'0')}</div><div><div class="cart-name">${x.name}</div><div class="cart-meta">${x.quantity} × ₹${x.price}</div><div style="margin-top:10px"><button class="cart-icon" onclick="setQty('${x.slug}',${x.quantity-1})">−</button> <button class="cart-icon" onclick="setQty('${x.slug}',${x.quantity+1})">＋</button> <button class="cart-icon" onclick="removeItem('${x.slug}')">×</button></div></div><strong>₹${x.price*x.quantity}</strong></div>`).join(''):`<div style="padding:80px 0;color:var(--sage-light)">Your bag is waiting. Explore the menu and bring something home.</div>`}</section><aside class="summary-card"><div class="eyebrow">ORDER SUMMARY</div><h2 class="display">₹${sub.toLocaleString('en-IN')}</h2><div class="sumrow"><span>Subtotal</span><span>₹${sub.toLocaleString('en-IN')}</span></div><div class="sumrow"><span>Delivery</span><span>${del?'₹'+del:'FREE'}</span></div><div class="sumrow sumtotal"><span>Total</span><span>₹${tot.toLocaleString('en-IN')}</span></div><a class="btn primary" style="width:100%;margin-top:24px" href="#/${c.length?'checkout':'menu'}">${c.length?'CHECKOUT →':'EXPLORE MENU'}</a><a href="#/menu" style="display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--sage-deep)">Continue shopping →</a></aside></div></main>`+footer()}
function pageCheckout(){const c=getCart(),sub=subtotal(),del=delivery(),tot=total();setTimeout(()=>bindCheckout(),0);return header()+`<main class="page"><form id="checkout" class="checkout-grid"><section><div class="eyebrow">05 / CHECKOUT</div><h1 class="title display">Almost there.</h1><div class="field"><label>FULL NAME</label><input required value="Abhi Sharma"></div><div class="field"><label>PHONE</label><input required placeholder="+91 9XXXXXXXXX"></div><div class="field"><label>ADDRESS</label><input required value="24, Example Street, Bengaluru"></div><div class="field"><label>DELIVERY INSTRUCTIONS</label><textarea rows="3" placeholder="Leave at the door if unavailable"></textarea></div><div style="margin-top:40px"><div class="eyebrow">PAYMENT</div><div class="pay-options">${['UPI','CARD','PAY AT DOOR'].map((x,i)=>`<button type="button" class="pay ${i===0?'active':''}" data-pay="${x}">${i===0?'●':'○'} &nbsp; ${x}</button>`).join('')}</div></div></section><aside class="checkout-side"><div class="eyebrow" style="color:var(--sage-light)">YOUR ORDER</div>${c.length?c.map(x=>`<div class="sumrow"><span>${x.name} × ${x.quantity}</span><span>₹${x.price*x.quantity}</span></div>`).join(''):`<div style="margin:20px 0;color:var(--sage-light);font-size:12px">Your bag is empty.</div>`}<div class="sumrow"><span>Delivery</span><span>${del?'₹'+del:'FREE'}</span></div><div class="sumrow sumtotal"><span>TOTAL</span><span>₹${tot.toLocaleString('en-IN')}</span></div><button ${c.length?'':'disabled'} class="btn secondary" style="width:100%;margin-top:22px" id="place">PLACE ORDER · ₹${tot.toLocaleString('en-IN')}</button><div style="margin-top:12px;text-align:center;font-size:10px;color:var(--sage-light)">Payment is simulated for this prototype.</div></aside></form></main>`+footer()}
function bindCheckout(){document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('checkout').onsubmit=e=>{e.preventDefault();const id='TRS-'+Math.floor(1000+Math.random()*8999);localStorage.setItem('tresor-order',JSON.stringify({id,status:2,total:total()}));localStorage.removeItem('tresor-cart');location.hash='#/order/'+id}}
function pageOrder(id){return header()+`<main class="page"><div class="center"><div class="eyebrow">ORDER CONFIRMED</div><h1 class="display">You’re going to have<br>a very good afternoon.</h1><div class="order-code">#${id}</div><div style="margin-top:34px;color:var(--muted);font-size:13px">Estimated delivery · 35–45 min</div><div style="margin-top:8px;color:var(--success);font-size:13px">Payment status · Successful (mock)</div><div class="actions"><a class="btn primary" href="#/track/${id}">TRACK ORDER →</a><a class="btn secondary" href="#/menu">BACK TO MENU</a></div></div></main>`+footer()}
function pageTrack(id){return header()+`<main class="page"><div class="track-grid"><section><div class="eyebrow">07 / LIVE ORDER</div><h1 class="title display">Your order is moving.</h1><div style="font-size:12px;color:var(--sage-deep);letter-spacing:.12em">#${id} · PREPARING</div><div class="track-list">${[['NEW','Order received'],['CONFIRMED','Order confirmed'],['PREPARING','Kitchen is working on it'],['READY','Ready to leave the café'],['OUT FOR DELIVERY','On the way to you'],['DELIVERED','Enjoy your order']].map((x,i)=>`<div class="track-row ${i<3?'done':''} ${i===2?'active':''}"><div class="track-dot">${String(i+1).padStart(2,'0')}</div><div class="track-stage">${x[0]}</div><div class="track-copy">${x[1]}</div></div>`).join('')}</div></section><aside class="track-side"><div class="eyebrow">DELIVERY</div><div class="display" style="font-size:30px;line-height:1.05;margin-top:16px">24, Example Street<br>Bengaluru</div><div class="eyebrow" style="margin-top:58px">ARRIVING IN</div><div class="track-time">35–45 MIN</div><p class="muted" style="font-size:12px">3 items · ₹1,240</p><a class="btn secondary" href="#/order/${id}">VIEW ORDER DETAILS</a></aside></div></main>`+footer()}
function pageAbout(){return header('about')+`<main class="page section"><div class="eyebrow">08 / THE HOUSE</div><div class="about-hero rise">${img('Full-bleed café interior / people / light')}<div class="about-overlay"><h1 class="display">A place to stay a little longer.</h1></div></div><div class="about-grid"><div><div class="eyebrow">FROM MORNING TO LATE AFTERNOON</div><p>Coffee. Pastry. Conversation. Tresor is built around the simple idea that coffee, pastry and atmosphere should feel considered — never overworked.</p></div>${img('Pastry detail')}</div></main>`+footer()}
function pageContact(){return header('contact')+`<main class="page section"><div class="eyebrow">09 / VISIT</div><div class="contact-grid"><section class="contact"><h1 class="display">Come by.<br>Stay awhile.</h1><div class="address">24, Example Street<br>Whitefield, Bengaluru</div><div style="margin-top:22px;font-size:11px;color:var(--muted);letter-spacing:.12em">MON — SUN · 08:00 — 23:00</div><div style="margin-top:26px;font-size:13px;line-height:1.8">hello@tresor.example<br>+91 9XXXXXXXXX</div><div class="contact-actions"><a class="btn primary" href="#map">GET DIRECTIONS</a><a class="btn secondary" href="tel:+919000000000">CALL</a></div><div class="eyebrow" style="margin-top:58px">ORDER DELIVERY</div><div class="contact-actions"><a class="btn secondary" href="https://www.zomato.com/" target="_blank">ZOMATO ↗</a><a class="btn secondary" href="https://www.swiggy.com/" target="_blank">SWIGGY ↗</a></div></section><div class="map" id="map"><div class="pin"><span>T</span></div><div style="position:absolute;left:30px;bottom:28px;color:#fff;font-size:10px;letter-spacing:.18em">BENGALURU</div></div></div></main>`+footer()}
function pageAccount(){return `<main class="account-shell"><div class="account-wrap"><aside class="account-nav"><div class="eyebrow" style="color:var(--sage-light)">ACCOUNT</div><h1 class="display">Abhi Sharma</h1>${['MY ORDERS','SAVED ADDRESSES','PAYMENT METHODS','ACCOUNT PRIVACY','LOG OUT'].map((x,i)=>`<a href="#" class="account-link ${i===0?'active':''}">${x}</a>`).join('')}</aside><section><div class="eyebrow" style="color:var(--sage-light)">RECENT ORDERS</div><div class="orders">${[['TRS-1048','Today · Delivered','₹1,240'],['TRS-1039','Yesterday · Delivered','₹680'],['TRS-1021','28 Sep · Delivered','₹1,020']].map(x=>`<div class="order-row"><div><div class="order-code-sm">#${x[0]}</div><div class="order-meta">${x[1]}</div></div><div>${x[2]}</div><a class="btn secondary" href="#/track/${x[0]}">VIEW</a></div>`).join('')}</div></section></div></main>`+footer()}
function pageNotFound(){return header()+`<main class="page section"><div class="center"><div class="eyebrow">404</div><h1 class="display">That page wandered off.</h1><a class="btn primary" href="#/">RETURN HOME</a></div></main>`+footer()}
function render(){let hash=location.hash.replace(/^#\/?/,'');let parts=hash.split('/');let p='';if(!hash)p=pageHome();else if(parts[0]==='menu')p=pageMenu();else if(parts[0]==='product'&&parts[1])p=pageProduct(parts[1]);else if(parts[0]==='cart')p=pageCart();else if(parts[0]==='checkout')p=pageCheckout();else if(parts[0]==='order'&&parts[1])p=pageOrder(parts[1]);else if(parts[0]==='track'&&parts[1])p=pageTrack(parts[1]);else if(parts[0]==='about')p=pageAbout();else if(parts[0]==='contact')p=pageContact();else if(parts[0]==='account')p=pageAccount();else p=pageNotFound();document.getElementById('app').innerHTML=p;window.scrollTo({top:0,behavior:'smooth'})}
window.addEventListener('hashchange',render);window.addEventListener('storage',render);render();
</script>
</body>
</html>
