# Local services for Tresor. Start: `docker compose up -d`. Data persists in named volumes.
# Ports are non-default (5433, 6380) so they don't collide with other local installs.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tresor
      POSTGRES_PASSWORD: tresor
      POSTGRES_DB: tresor
    ports: ["127.0.0.1:5433:5432"]
    volumes: [tresor-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tresor -d tresor"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [tresor-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  tresor-pg:
  tresor-redis:
